base_model_path: models/stable-video-diffusion-img2vid-xt-1-1
# resume UNet/PoseNet from the train_all348 run (step 19475) instead of the
# original pretrained checkpoint -- continuous_tokenizer/pose_bundle_encoder
# are not in this checkpoint's unet./pose_net. prefixes, so they still start
# fresh regardless (unavoidable anyway since visual_embed_dim is changing
# shape below).
init_checkpoint: trainlogs/train_all348/checkpoints/last_00019475.pth
train_manifest: /mnt/SSD/datasets/MimicMotion/train_manifest_all.json
output_dir: trainlogs/train_capacity_lr_test01

num_epochs: 5000
seed: 42
resolution: 576
num_frames: 8
batch_size: 1
num_workers: 4

fps: 15
motion_bucket_id: 127
noise_aug_strength: 0

learning_rate: 1.0e-5
lr_warmup_steps: 500
grad_clip: 1.0

# Diagnostic test (2026-07-06): train_all348's continuous_tokenizer cos_sim
# plateaued around step ~8000-10000 (mean cos_sim per 1920-step window went
# 0.42 -> 0.50 by step ~9000, then flat/noisy at 0.44-0.50 through step
# 19475 -- measured directly from trainlogs/train_all348's log, not
# assumed). Testing two hypotheses together: (a) capacity ceiling from the
# 480x compression bottleneck (visual_embed_dim 64 -> 128 below), and (b) LR
# decay -- tokenizer_learning_rate was flat at full value with no decay
# after warmup. lr_decay_steps=3000 matches this test's planned run length.
lr_decay_steps: 3000
lr_decay_min_scale: 0.1

# sigma: lognormal, concentrated around the SVD training distribution.
# loguniform down to sigma_min=0.002 was blowing up the EDM loss weight
# (~1/sigma^2) and destabilizing full-parameter fine-tuning within a few
# hundred steps (see 2026-07-03 debugging: output collapsed to pure noise
# by step 600). lognormal avoids sampling those extreme low-sigma batches
# nearly as often.
sigma_sample_mode: lognormal
sigma_data: 1.0
p_mean: 0.7
p_std: 1.6
sigma_min: 0.002
sigma_max: 700.0

# 2026-07-05: switched to real multi-sample training over all 14 valid
# samples in train_dataset/train_manifest_14_local.json (previously this
# project only ever trained on a single repeated sample). false means the
# DataLoader actually shuffles/iterates across all 14 samples instead of
# looping one fixed batch.
overfit_single_sample: false
# Must be true whenever debug_overfit_single_batch (below) is also true --
# see that key's comment for why (otherwise the "fixed batch" still gets a
# different noise level every step and isn't actually fixed). Irrelevant now
# that overfit_single_sample is false.
overfit_fixed_sigma: false

# train_base1.py: >1.0 upweights the loss inside hand_mask_dir masks; 1.0 disables it
hand_region_weight: 1.0
# train_base1.py: probability of zeroing ref image/pose conditioning per step (CFG dropout)
cond_drop_prob: 0.0

print_every_steps: 20
save_every_steps: 100

# train_vq.py: one-shot read-only UNet/PoseNet feature shape logging (see
# feature_inspect.py). Prints once on the first forward pass, then hooks
# remove themselves; no effect on training either way. Off by default.
enable_feature_inspection: false

# train_vq.py: spatio-temporal continuous tokenizer auxiliary branch (see
# visual_tokenizer.py: SpatioTemporalContinuousTokenizer). No pose
# encoder/FiLM/VQ/codebook yet; reconstruction is not injected back into the
# UNet. False reproduces the baseline exactly.
enable_continuous_tokenizer: true
# Selected via feature inspection (2026-07-03): down_blocks[1] output,
# shape (B*T, 640, 32, 18) for resolution=576/num_frames=8. Informational
# only (the hook target itself is hardcoded to down_blocks[1] in train_vq.py).
visual_feature_name: down_blocks[1].output
temporal_patch_size: 4
spatial_patch_height: 4
spatial_patch_width: 3
# 2026-07-06: doubled 64 -> 128 to test whether the 480x compression
# bottleneck (patch_dim=30720) was capping cos_sim once training moved from
# 14 samples to 348 diverse samples (see lr_decay_steps comment above).
visual_embed_dim: 128
# 2026-07-05: lowered from 1.0 to 0.1 once enable_continuous_adapter_injection
# became available -- this is now the first stage where diffusion_loss itself
# can be affected by the adapter, so the auxiliary reconstruction loss should
# not dominate it (see enable_continuous_adapter_injection's comment below).
# Only matters when residual injection is off/injection_scale~0 in terms of
# affecting diffusion_loss; still controls how hard the tokenizer trains its
# own reconstruction either way.
lambda_tokenizer_reconstruction: 0.1
detach_tokenizer_input: true
# Required (no fallback) whenever enable_continuous_tokenizer is true; the
# tokenizer is always its own optimizer param group, separate from learning_rate.
#
# 2026-07-03 debug_overfit_single_batch validation: at the "default-looking"
# value of 1e-5 (same as learning_rate) the tokenizer barely moved even after
# 60 steps. patch_dim=30720 -> embed_dim=64 is a 480x compression bottleneck
# (Lt=4 * Ph=4 * Pw=3 * C=640), so a small linear encoder/decoder needs a much
# higher LR than the UNet's own 1e-5 to make visible progress in a short debug
# run. 1e-2 reached 71% reconstruction_loss reduction and cosine_similarity
# 0.002->0.87 in 150 steps (still decreasing, not yet plateaued). Use
# something in the 1e-3~1e-2 range for debug_overfit_single_batch runs; a
# real long training run can likely use something more modest.
tokenizer_learning_rate: 1.0e-2

# Debug: repeat one batch for debug_overfit_steps steps, then print an
# initial-vs-final reconstruction_loss/cosine_similarity report and stop
# (instead of training indefinitely). Only meaningful with
# enable_continuous_tokenizer: true.
#
# 2026-07-03: this only overfits a truly FIXED input if overfit_fixed_sigma
# is also true. With overfit_fixed_sigma: false (the default), sigma/noise
# are re-sampled every step even though the video/pose batch is fixed, so the
# down_blocks[1] feature the tokenizer sees is DIFFERENT every step (varying
# noise level) -- not a fixed target at all. That first attempt showed
# reconstruction_loss barely moving (even getting worse over 60 steps). Set
# overfit_fixed_sigma: true whenever debug_overfit_single_batch is true, or
# the "single-batch overfit" report is meaningless.
debug_overfit_single_batch: false
debug_overfit_steps: 500

# train_vq.py: pose bundle auxiliary branch -- Global Pose Embedding + Local
# Pose Occupancy only (see pose_bundle_encoder.py). No FiLM/modulation/UNet
# injection/VQ yet; pose_output is never combined with visual_tokens or the
# UNet feature. False reproduces the prior (tokenizer-only) behavior exactly.
enable_pose_bundle_encoder: true
# Selected via pose-branch inspection (2026-07-03): PoseNet.conv_layers
# output (128ch, before final_proj), shape (B*T, 128, 128, 72) for
# resolution=576/num_frames=8. Informational only (the hook target itself is
# hardcoded to comps.pose_net.conv_layers in train_vq.py).
pose_feature_name: pose_net.conv_layers.output
# Required (no fallback); matches PoseNet.conv_layers's real output channel
# count (verified via hook, NOT final_proj's 320-channel noise_latent_channels).
pose_channels: 128
pose_embed_dim: 32
pose_hidden_dim: 128
# "none" is the recommended default: LocalPoseOccupancy reads raw activation
# MAGNITUDE (abs().mean over channels) as its pose-evidence signal.
# channel_layernorm renormalizes every individual spatial-temporal position to
# zero-mean/unit-variance across channels, which would erase exactly the
# magnitude signal occupancy depends on. channel_standardize (a single
# per-sample-per-channel scalar, not per-position) would be safer if real
# training data ever shows channel-scale imbalance, but there's no such
# evidence yet -- watch pose_bundle/global_pose_channel_variance before
# switching this.
pose_normalization: none
# Measured PoseNet.conv_layers activation (synthetic input): min=-0.2785,
# max=9.3075, mean=0.0612 -- continuous SiLU output, not a discrete label map
# or a [0,1] heatmap, hence abs_mean + bilinear alignment (not nearest).
occupancy_activation_mode: abs_mean
occupancy_normalization: sigmoid
# 2026-07-03: measured on REAL pose data (abs().mean(dim=channel) of
# PoseNet.conv_layers output, one frame): mean=0.014, std=0.024, min=0.003,
# max=0.19 -- i.e. raw activation values are tiny (~1e-2 scale). With the
# "textbook" default temperature=1.0, sigmoid((activation-center)/1.0) stays
# in its near-linear region around 0.5 for every patch regardless of real
# spatial differences: occ_std collapsed to 0.002 and active_ratio=0.0 (the
# exact "occupancy is spatially uniform" failure mode this stage's success
# criteria warn about). Sweeping temperature on the same real sample:
#   temp=1.0   -> occ_std=0.002  active_ratio=0.00  (collapsed)
#   temp=0.1   -> occ_std=0.021  active_ratio=0.00
#   temp=0.02  -> occ_std=0.101  active_ratio=0.17
#   temp=0.01  -> occ_std=0.176  active_ratio=0.26  (good spread, chosen default)
#   temp=0.005 -> occ_std=0.280  active_ratio=0.33  (more extreme, still valid)
# 0.01 gives clear separation (min=0.32, max=0.97) without saturating to 0/1.
occupancy_sigmoid_temperature: 0.01
occupancy_active_threshold: 0.6
occupancy_background_threshold: 0.4
# 2026-07-05: lowered from 1.0 to 0.1, same reasoning as
# lambda_tokenizer_reconstruction above (enable_continuous_adapter_injection
# is the first stage where diffusion_loss can be affected by the adapter).
lambda_pose_reconstruction: 0.1
detach_pose_encoder_input: true
# Required (no fallback) whenever enable_pose_bundle_encoder is true; own
# optimizer param group, separate from learning_rate/tokenizer_learning_rate.
pose_encoder_learning_rate: 1.0e-2
save_pose_bundle_debug: false

# Debug: repeat one batch for debug_pose_overfit_steps steps (pose branch
# only), then print an initial-vs-final pose_reconstruction_loss /
# global_pose_std / global_pose_temporal_variance report and stop. As with
# debug_overfit_single_batch, set overfit_fixed_sigma: true alongside this if
# enable_continuous_tokenizer is also on (the pose branch itself does not
# depend on sigma, but a shared fixed_batch training step does run the full
# diffusion forward too).
debug_overfit_pose_batch: false
debug_pose_overfit_steps: 500

# train_vq.py: pose-conditioned FiLM -- first stage where pose information is
# actually applied to visual tokens (see pose_conditioned_film.py). Requires
# BOTH enable_continuous_tokenizer=true and enable_pose_bundle_encoder=true
# (validated at startup, raises ValueError otherwise). Only modulates the
# tokenizer's own auxiliary reconstruction path; the UNet still runs on the
# untouched feature (no injection/injection_scale/VQ/codebook/commitment loss
# yet). False reproduces the prior (tokenizer+pose, unmodulated) behavior
# exactly.
enable_pose_conditioned_film: false
film_hidden_dim: 128
lambda_film_reg: 1.0e-4
# Required (no fallback) whenever enable_pose_conditioned_film is true; own
# optimizer param group, separate from learning_rate/tokenizer_learning_rate/
# pose_encoder_learning_rate.
film_learning_rate: 1.0e-2
# film_scale is a learnable scalar gating the whole FiLM delta; 0.0 makes
# modulated_tokens == visual_tokens exactly at step 0 (baseline-safe default).
#
# 2026-07-04: measured directly (test_pose_conditioned_film.py) -- with BOTH
# film_scale_init=0.0 AND film_last_linear_init="zero" (the two defaults),
# gradient into film_scale AND into film_mlp's last Linear is exactly 0 at
# init, not just small: film_delta = gamma*visual_tokens+beta is already 0
# (zero-init last Linear), so d(modulated_tokens)/d(film_scale) =
# occupancy*film_delta = 0, and d(modulated_tokens)/d(gamma_weight) =
# film_scale*occupancy*(...) = 0 too (film_scale=0 kills that path as well).
# backward() still runs cleanly and .grad tensors exist (not None), but their
# VALUES are all zero -- true double-zero gradient starvation, not just slow
# learning. If debug_overfit_film_batch shows film_scale/gamma/beta stuck at
# 0 after film_learning_rate steps, use one of the two documented
# alternatives instead of increasing film_learning_rate further (it won't
# help since the gradient itself is 0):
#   film_scale_init: 1.0e-3   (keeps modulated_tokens==visual_tokens at step 0
#                              exactly, since gamma/beta values are still 0,
#                              but unblocks gradient into film_mlp because the
#                              chain-rule coefficient through film_scale is no
#                              longer 0)
#   film_last_linear_init: small_normal   (gamma/beta become non-zero from
#                              step 0, breaking the exact init-identity
#                              invariant slightly, controlled by
#                              film_last_linear_init_std)
film_scale_init: 0.0
film_last_linear_init: zero
film_last_linear_init_std: 0.02
# Alternative (3) from the same investigation: keep FiLM parameters frozen
# (requires_grad=False) for the first N steps, e.g. to let tokenizer/pose
# branches settle first, then auto-unfreeze. 0 disables (FiLM trains from
# step 0, subject to the gradient-starvation caveat above).
film_freeze_steps: 0

# Debug: repeat one batch for debug_film_overfit_steps steps (FiLM branch
# only), then print an initial-vs-final reconstruction_loss/film_scale/
# gamma_mean/modulation_strength report and stop. Requires
# enable_pose_conditioned_film=true. As with the other debug_overfit_* modes,
# set overfit_fixed_sigma: true alongside this.
debug_overfit_film_batch: false
debug_film_overfit_steps: 500

# train_vq.py: continuous adapter residual injection -- first stage where
# reconstructed_feature is fed back into the UNet's own forward pass (see
# continuous_adapter_injector.py). Requires enable_continuous_tokenizer=true,
# enable_pose_bundle_encoder=true, AND enable_pose_conditioned_film=true
# (validated at startup, raises ValueError otherwise) -- the whole
# tokenizer->pose->FiLM pipeline now runs INSIDE a forward hook on
# down_blocks[1] instead of the training loop, because injection must happen
# DURING the same comps.unet(...) call that produces model_pred. False
# reproduces the prior (FiLM, non-injecting) behavior exactly.
enable_continuous_adapter_injection: false
# "none": pipeline still computed (for the same aux losses/logging as before)
# but UNet output is completely untouched.
# "residual": feature_for_unet = visual_feature + injection_scale *
# (reconstructed_feature - visual_feature), actually replacing the feature
# both on the main down_blocks path AND its aliased skip-connection entry.
adapter_injection_mode: none
# Learnable scalar gating the residual injection; 0.0 makes feature_for_unet
# == visual_feature exactly at step 0 (baseline-safe default), independent of
# adapter_injection_mode.
injection_scale_init: 0.0
lambda_injection_reg: 1.0e-4
# Required (no fallback) whenever enable_continuous_adapter_injection is true;
# own optimizer param group (a single scalar), separate from
# learning_rate/tokenizer_learning_rate/pose_encoder_learning_rate/
# film_learning_rate.
injection_learning_rate: 1.0e-2

# Note: this is the first stage where diffusion_loss itself can be affected by
# the adapter (previous stages only ever added auxiliary losses on the side).
# lambda_tokenizer_reconstruction/lambda_pose_reconstruction were lowered to
# 0.1 (from 1.0) above, at their original definitions, for exactly this
# reason -- see the comments there. lambda_film_reg/lambda_injection_reg
# already default to 1e-4 (defined above, next to their own enable flags).

# Debug: repeat one batch for debug_injection_overfit_steps steps (residual
# injection only), then print an initial-vs-final diffusion_loss/
# reconstruction_loss/injection_scale/injection_strength report and stop.
# Requires enable_continuous_adapter_injection=true (and adapter_injection_mode:
# residual for the injection itself to have any effect). As with the other
# debug_overfit_* modes, set overfit_fixed_sigma: true alongside this.
debug_overfit_injection_batch: false
debug_injection_overfit_steps: 500

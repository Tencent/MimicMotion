base_model_path: models/stable-video-diffusion-img2vid-xt-1-1
init_checkpoint: models/MimicMotion_1-1.pth
train_manifest: /mnt/SSD/datasets/MimicMotion/manifest_single_sample.json
output_dir: frame_vqvae_allskip01

vq_num_epochs: 5000
seed: 42
resolution: 576
num_frames: 8
batch_size: 1
num_workers: 4

fps: 15
motion_bucket_id: 127
noise_aug_strength: 0

# 4개 down_block 전체 resnet(총 8개 skip)에 VQ 적용
# 블록별 별도 codebook (320ch / 640ch / 1280ch / 1280ch)
vq_latent_dim: 64
vq_num_codes: 512
vq_beta: 0.25
vq_group_size: null

vq_learning_rate: 1.0e-4
vq_lr_warmup_steps: 500
vq_skip_weight: 0.01

# sigma: loguniform 0.002~700
vq_sigma_sample_mode: loguniform
vq_sigma_min: 0.002
vq_sigma_max: 700.0

vq_overfit_single_sample: true
vq_overfit_fixed_sigma: false

print_every_steps: 20
save_every_steps: 300
